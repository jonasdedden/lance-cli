name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs on the same ref/PR when a new push lands. Saves
# CI minutes when developers push corrections in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Rust: formatting + clippy.
  # ──────────────────────────────────────────────────────────────────
  rust-fmt-clippy:
    name: rust · fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: rust-clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ──────────────────────────────────────────────────────────────────
  # Rust: workspace test suite.
  # ──────────────────────────────────────────────────────────────────
  rust-test:
    name: rust · cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: rust-test
      - run: cargo test --no-run --locked
      - run: cargo test --locked

  # ──────────────────────────────────────────────────────────────────
  # Wheel build: For shipping `lance-cli` to pure Python users
  # ──────────────────────────────────────────────────────────────────
  wheel:
    name: wheel · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    # CI-only optimization knobs. This is a *merge gate*: its job is to prove
    # the wheel compiles and links under the release configuration
    # (debug-assertions/overflow-checks off, `--release` codepath), NOT to
    # produce a shippable artifact. So we keep `--release` but turn the
    # optimizer down — opt-level=0 + many codegen-units makes the whole
    # lance/arrow dep tree compile at roughly debug speed instead of paying for
    # opt-level=3 codegen on ~545 crates (~18 min cold → a few min).
    #
    # These MUST live at job level, not on the build step: Swatinem/rust-cache
    # runs inside setup-toolchain (earlier than the build step) and folds any
    # CARGO_*-prefixed env it can see into its cache key. Job-level env is
    # visible to that step, so the cache fingerprint tracks opt-level=0 and this
    # job stops exact-hitting the stale opt-level=3 cache — it saves and later
    # restores its own (smaller) unoptimized cache, unlocking the warm path.
    #
    # Shipped wheels are built by release.yml, which does NOT set these and
    # therefore keeps the default release profile (opt-level=3). Do not add
    # these overrides there.
    env:
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
      # Redundant with the release-profile default (debug info off) — kept as
      # future-proofing so lowered opt-level can never drag debug info in.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-toolchain
        with:
          cache-key: wheel-${{ matrix.os }}
          python: "true"
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build release wheel
        run: uvx maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Aggregator: a single required check for branch-protection rules,
  # so we don't have to keep the protected-checks list in sync with
  # job names.
  # ──────────────────────────────────────────────────────────────────
  ci:
    name: ci
    if: always()
    needs: [rust-fmt-clippy, rust-test, wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed."
