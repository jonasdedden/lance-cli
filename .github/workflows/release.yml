name: Release

# Normally triggered by pushing an annotated tag matching `v*` (e.g. v0.1.0,
# v0.2.0-rc1). That trigger is commented out for now — see below. The
# `workflow_dispatch` button remains, so a release-engineer can still build
# artifacts for an existing tag by hand (also useful when a runner died
# mid-matrix).
on:
  # Disabled until the repo moves into the Lance namespace — re-enable
  # alongside the first lance-cli release.
  # push:
  #   tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref / tag to build (e.g. v0.1.0)"
        required: true
        type: string

# Cancel a duplicate run targeting the same tag (e.g. tag re-pushed).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Gate. The tag is only a label; Cargo.toml is the source of truth
  # for the version. If they disagree, every downstream job would build
  # and publish the wrong version, so stop here instead.
  # ──────────────────────────────────────────────────────────────────
  verify:
    name: verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: check
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          tag="${ref##*/}"; tag="${tag#v}"
          crate=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate — bump Cargo.toml (and Cargo.lock) before tagging"
            exit 1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [$tag] section"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "releasing $tag" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # Linux wheels: native runners (x86_64 + aarch64), Zig as the linker
  # for a glibc 2.17 floor. `--compatibility manylinux2014` tells maturin
  # to tag the wheel accordingly and run its built-in auditwheel
  # validation. No QEMU, no manylinux container.
  # ──────────────────────────────────────────────────────────────────
  linux:
    name: linux · ${{ matrix.target }}
    needs: [verify]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runs-on: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - target: aarch64
            runs-on: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-toolchain
        with:
          rust-target: ${{ matrix.rust-target }}
          cache-key: release-linux-${{ matrix.target }}
          python: "true"
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: mlugg/setup-zig@v2
      # Use hardcoded version numbers for now - skipping manually setting version numbers
      # - name: Sync workspace + pyproject version to tag
      # run: python3 tools/set_version_from_tag.py "${{ inputs.ref || github.ref }}"
      - name: Build wheel
        run: >
          uvx maturin build --release --zig
          --target ${{ matrix.rust-target }}
          --compatibility manylinux2014
          --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # macOS: x86_64 (Intel) + arm64 (Apple Silicon). The `macos-13`
  # runner is x86_64, `macos-14` is arm64. Both are native — no
  # cross-compile needed.
  # ──────────────────────────────────────────────────────────────────
  macos:
    name: macos · ${{ matrix.target }}
    needs: [verify]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            runs-on: macos-14
            rust-target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/setup-toolchain
        with:
          rust-target: ${{ matrix.rust-target }}
          cache-key: release-macos-${{ matrix.target }}
          python: "true"
          python-version: ${{ env.PYTHON_VERSION }}
      # Use hardcoded version numbers for now - skipping manually setting version numbers
      # - name: Sync workspace + pyproject version to tag
      # run: python3 tools/set_version_from_tag.py "${{ inputs.ref || github.ref }}"
      - name: Build wheel
        run: >
          uvx maturin build --release
          --target ${{ matrix.rust-target }}
          --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Source distribution. Platform-independent, so just spin up the
  # cheapest runner and let maturin package the source.
  # ──────────────────────────────────────────────────────────────────
  sdist:
    name: sdist
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # Use hardcoded version numbers for now - skipping manually setting version numbers
      # - name: Sync workspace + pyproject version to tag
      # run: python3 tools/set_version_from_tag.py "${{ inputs.ref || github.ref }}"
      - name: Build sdist
        run: uvx maturin sdist --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # GitHub Release: attach every wheel + sdist as release assets.
  # The release is created in `draft` mode by default — release-eng
  # reviews the artifact list and publishes manually. Skips on a
  # workflow_dispatch run because that's typically a re-build, not a
  # re-publish.
  # ──────────────────────────────────────────────────────────────────
  github-release:
    name: github release
    needs: [linux, macos, sdist]
    # Only on real tag pushes — never on workflow_dispatch, even if dispatched
    # from a tag ref. `event_name == 'push'` excludes the manual-run path.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release with attachments
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true

  # ──────────────────────────────────────────────────────────────────
  # crates.io publish.
  #  Single-crate workspace, so one `cargo publish` call is enough.
  # ──────────────────────────────────────────────────────────────────
  crates-io:
   name: publish to crates.io
   needs: [verify, github-release]
   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
   runs-on: ubuntu-latest
   environment:
     name: crates-io
   steps:
     - uses: actions/checkout@v7
       with:
         ref: ${{ inputs.ref || github.ref }}
     - uses: ./.github/actions/setup-toolchain
       with:
         cache-key: release-crates-io
     - name: Publish
       env:
         CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
       run: cargo publish --locked
     - name: Confirm the version is live on crates.io
       run: |
         v="${{ needs.verify.outputs.version }}"
         for _ in $(seq 1 10); do
           if curl -sSf -H "User-Agent: lance-cli-release (mail@jonas-dedden.de)" \
                "https://crates.io/api/v1/crates/lance-cli/$v" > /dev/null; then
             echo "lance-cli $v is live"; exit 0
           fi
           sleep 15
         done
         echo "::error::lance-cli $v never appeared on crates.io"
         exit 1

  # ──────────────────────────────────────────────────────────────────
  # PyPI publish (trusted publishing).
  # Trusted publishing requires no API token: PyPI verifies
  # the OIDC token GitHub mints and matches it against the configured
  # repo + workflow + environment triple.
  # ──────────────────────────────────────────────────────────────────
  pypi:
   name: publish to PyPI
   needs: [verify, github-release]
   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
   runs-on: ubuntu-latest
   environment:
     name: pypi
     url: https://pypi.org/project/lance-cli
   permissions:
     id-token: write   # OIDC token for trusted publishing
   steps:
     - uses: actions/download-artifact@v8
       with:
         path: dist
         merge-multiple: true
     - uses: pypa/gh-action-pypi-publish@release/v1
       with:
         packages-dir: dist
     - name: Confirm the version is live on PyPI
       run: |
         v="${{ needs.verify.outputs.version }}"
         for _ in $(seq 1 10); do
           if curl -sSf "https://pypi.org/pypi/lance-cli/$v/json" > /dev/null; then
             echo "lance-cli $v is live"; exit 0
           fi
           sleep 15
         done
         echo "::error::lance-cli $v never appeared on PyPI"
         exit 1
