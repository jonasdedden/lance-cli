[package]
name = "lance-cli"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "Command-line tool for inspecting Lance datasets."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jonasdedden/lance-cli"
documentation = "https://docs.rs/lance-cli"
repository = "https://github.com/jonasdedden/lance-cli"

[lib]
name = "lance_cli"
path = "src/lib.rs"

[[bin]]
name = "lance-cli"
path = "src/main.rs"

[dependencies]
arrow = { version = "57", features = ["prettyprint"] }
arrow-array = "57"
arrow-cast = "57"
arrow-schema = "57"
base64 = "0.22.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
# `completions` subcommand generators; tracks clap's own minor version.
clap_complete = "4.6.7"
comfy-table = "7.2.2"
csv = "1.4.0"
futures = "0.3.32"
# `cat` input glob expansion. Already in the tree transitively via lance, so
# depending on it directly adds no binary size.
glob = "0.3.4"
# Scan progress indicator on stderr. `default-features = false` drops the two
# default features — `unicode-width` (wide-char width tables) and `wasmbind`
# (a wasm-only timer shim) — neither of which a plain ASCII bar/spinner on a
# native target needs. The heavier extras (rayon, tokio, in_memory, …) are
# opt-in and were never enabled.
indicatif = { version = "0.18.6", default-features = false }
# `aws`/`gcp`/`azure` enable object_store backends for s3://, gs:// and az://
# URIs. They are part of lance's default feature set, so listing them here is a
# deliberate no-op that pins remote support even if defaults ever change; it
# adds no binary size over the stock defaults.
lance = { version = "4.0.0", features = ["aws", "gcp", "azure"] }
lance-index = "4"
rand = "0.10.1"
rand_chacha = "0.10.0"
serde_json = { version = "1.0.149", features = ["preserve_order", "arbitrary_precision"] }
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util"] }

[dev-dependencies]
# Only `examples/write_lance_fixture.rs` uses this; the crate itself reports
# errors through `crate::Error`.
anyhow = "1.0.102"
lance-linalg = "4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
